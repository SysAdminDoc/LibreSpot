<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LibreSpot offscreen preview</title>
    <link rel="stylesheet" href="../dist/style.css?preview=4.4">
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: var(--spice-main); font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="../node_modules/react/umd/react.development.js"></script>
    <script src="../node_modules/react-dom/umd/react-dom.development.js"></script>
    <script>
      const parameters = new URLSearchParams(window.location.search);
      const requestedPanel = parameters.get("panel") || "store";
      const requestedScheme = parameters.get("scheme") || "Dark";
      const requestedTier = parameters.get("tier") || "glass";
      const warningHealth = parameters.get("health") === "warning";

      const schemes = {
        Dark: {
          text: "FFFFFF", subtext: "B3B3B3", main: "0E0E10",
          "main-elevated": "18181B", highlight: "1E1E22",
          "highlight-elevated": "27272B", sidebar: "0A0A0C",
          player: "121214", card: "18181B", shadow: "000000",
          "selected-row": "FFFFFF", button: "1DB954",
          "button-active": "1ED760", "button-disabled": "4D4D52",
          "tab-active": "27272B", notification: "4687D6",
          "notification-error": "E22134", misc: "7F7F7F", accent: "1DB954"
        },
        Light: {
          text: "111214", subtext: "55585F", main: "FFFFFF",
          "main-elevated": "F1F2F5", highlight: "ECEDF1",
          "highlight-elevated": "E4E6EB", sidebar: "FFFFFF",
          player: "F1F2F5", card: "FFFFFF", shadow: "C9CCD4",
          "selected-row": "111214", button: "188741",
          "button-active": "188741", "button-disabled": "C2C6CF",
          "tab-active": "E4E6EB", notification: "2E77D0",
          "notification-error": "CD1A2B", misc: "8A8D95", accent: "188741"
        },
        OLED: {
          text: "FFFFFF", subtext: "A0A0A6", main: "000000",
          "main-elevated": "0A0A0A", highlight: "111111",
          "highlight-elevated": "1A1A1A", sidebar: "000000",
          player: "000000", card: "0A0A0A", shadow: "000000",
          "selected-row": "FFFFFF", button: "1ED760",
          "button-active": "1FDF64", "button-disabled": "3F3F3F",
          "tab-active": "1A1A1A", notification: "4687D6",
          "notification-error": "E22134", misc: "6E6E72", accent: "1ED760"
        },
        HighContrast: {
          text: "FFFFFF", subtext: "FFFFFF", main: "000000",
          "main-elevated": "000000", highlight: "1A1A1A",
          "highlight-elevated": "2A2A2A", sidebar: "000000",
          player: "000000", card: "000000", shadow: "000000",
          "selected-row": "FFFF00", button: "FFFF00",
          "button-active": "FFFFFF", "button-disabled": "767676",
          "tab-active": "3A3A3A", notification: "66B2FF",
          "notification-error": "FF5C6C", misc: "C8C8C8", accent: "FFFF00"
        }
      };

      const state = {
        schemaVersion: 1,
        name: requestedScheme === "OLED" ? "OLED" : "Custom",
        theme: "Prism",
        scheme: requestedScheme,
        schemes,
        layers: { palette: true, layout: true, effects: true, accessibility: true },
        effectsTier: requestedTier,
        autoEffects: true,
        lastMeasuredFps: 60,
        dynamicAccent: {
          mode: "album-art", preset: "VIBRANT", fixed: "1ED760",
          materialPalette: false, materialVariant: "tonalSpot"
        },
        appearance: {
          fontFamily: "Arial, sans-serif", radius: 12,
          scale: { navigation: 1, content: 1, playbar: 1, rightSidebar: 1 }
        },
        schedule: {
          enabled: false, lightStart: "07:00", darkStart: "19:00",
          lightScheme: "Light", darkScheme: "Dark"
        },
        enabledSnippets: ["rounded-cover-art"],
        featureOverrides: {},
        spotxSwitches: {},
        spicetifyOptions: {},
        userPresets: [],
        homeSections: ["Made for you", "Recently played", "Your mixes", "Popular albums"],
        sidebarItems: ["Home", "Search", "Your Library", "Liked Songs"],
        updatedAt: "2026-09-01T16:00:00.000Z"
      };

      const healthChecks = warningHealth
        ? [
            { id: "anchor:engine-style", label: "Managed style anchor", status: "healthy", detail: "The engine style node is present." },
            { id: "route:librespot", label: "LibreSpot route", status: "broken", detail: "The librespot route is absent from the current xpui bundle.", repairAction: "repair-custom-app-routes" },
            { id: "version:spotify", label: "Spotify version pin", status: "warning", detail: "This client is newer than the verified pin." }
          ]
        : [
            { id: "anchor:engine-style", label: "Managed style anchor", status: "healthy", detail: "The engine style node is present." },
            { id: "route:librespot", label: "LibreSpot route", status: "healthy", detail: "The librespot route is wired." },
            { id: "version:spotify", label: "Spotify version pin", status: "healthy", detail: "Spotify matches the verified pin." }
          ];

      const snapshot = {
        state,
        activeScheme: requestedScheme,
        health: {
          healthy: !warningHealth,
          checkedAt: "2026-09-01T16:00:00.000Z",
          pinnedSpotifyVersion: "1.2.93",
          checks: healthChecks
        },
        features: [
          { name: "enableGlobalNavBar", description: "Use Spotify's global navigation bar layout.", type: "bool", default: true, group: "Layout" },
          { name: "enableNowPlayingView", description: "Use the right-side Now Playing view.", type: "bool", default: true, group: "Now Playing" },
          { name: "enableJam", description: "Show Jam entry points when the account allows them.", type: "bool", default: false, group: "Playback", serverGated: true }
        ],
        installedExtensions: ["librespot-engine.js", "adblock.js"],
        installedCustomApps: ["librespot"],
        availableHomeSections: [
          { id: "Made For Polyjamorous", label: "Polyjamorous" },
          { id: "Recents", label: "Recents" },
          { id: "Jump back in", label: "Jump back in" }
        ],
        availableSidebarItems: [
          { id: "spotify:playlist:liked", label: "Liked Songs" },
          { id: "spotify:playlist:mix", label: "Daily Mix" }
        ]
      };

      const listeners = new Set();
      const historyListeners = new Set();
      const history = {
        location: { pathname: `/librespot/${requestedPanel}` },
        push(path) {
          this.location.pathname = path;
          for (const listener of historyListeners) listener(this.location);
        },
        listen(listener) {
          historyListeners.add(listener);
          return () => historyListeners.delete(listener);
        }
      };

      function applyScheme(name) {
        const scheme = schemes[name] || schemes.Dark;
        const root = document.documentElement;
        for (const [key, value] of Object.entries(scheme)) {
          root.style.setProperty(`--spice-${key}`, `#${value}`);
        }
        const text = scheme.text.match(/.{2}/g).map((part) => parseInt(part, 16)).join(", ");
        root.style.setProperty("--spice-rgb-text", text);
        root.style.setProperty("--librespot-accent", `#${scheme.accent}`);
      }

      applyScheme(requestedScheme);

      var Spicetify = {
        React,
        ReactDOM,
        Platform: { History: history, ClipboardAPI: { copyText() {} } },
        LocalStorage: { get() { return null; }, set() {}, remove() {} },
        Player: { addEventListener() {}, removeEventListener() {} },
        Config: {
          version: "2.42.1", current_theme: "Prism", color_scheme: requestedScheme,
          extensions: snapshot.installedExtensions, custom_apps: snapshot.installedCustomApps
        },
        showNotification() {}
      };

      window.LibreSpot = {
        getSnapshot() { return snapshot; },
        subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener); },
        async update(mutator) {
          mutator(snapshot.state);
          snapshot.activeScheme = snapshot.state.scheme;
          applyScheme(snapshot.activeScheme);
          for (const listener of listeners) listener(structuredClone(snapshot));
          return snapshot.state;
        },
        previewScheme(name) { snapshot.activeScheme = name; applyScheme(name); for (const listener of listeners) listener(structuredClone(snapshot)); },
        previewTheme(name, scheme) {
          if (!["Prism", "Compact", "Accessibility"].includes(name)) return false;
          document.documentElement.dataset.previewTheme = name;
          if (scheme) applyScheme(scheme);
          return true;
        },
        clearPreview() { delete document.documentElement.dataset.previewTheme; snapshot.activeScheme = snapshot.state.scheme; applyScheme(snapshot.activeScheme); for (const listener of listeners) listener(structuredClone(snapshot)); },
        refreshHealth() { return snapshot.health; },
        async copyProfile() {},
        async copyDiagnostics() {},
        openPanel(panel) { history.push(`/librespot/${panel}`); },
        openDesktopStore(kind, id, scheme) { window.__libreSpotDesktopStoreRequest = { kind, id, scheme }; }
      };
    </script>
    <script src="../dist/index.js?preview=4.4"></script>
    <script>
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(librespot.default));
      requestAnimationFrame(() => {
        document.documentElement.dataset.previewReady = "true";
      });
    </script>
  </body>
</html>
