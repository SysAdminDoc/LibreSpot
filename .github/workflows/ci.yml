name: LibreSpot CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore test project
        shell: powershell
        run: dotnet restore .\tests\LibreSpot.Desktop.Tests\LibreSpot.Desktop.Tests.csproj

      - name: Lint PowerShell hosts
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\Build-Scripts.ps1 -Lint

      - name: Validate PowerShell composition and resources
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\Build-Scripts.ps1 -Validate

      - name: Run Pester regression tests
        shell: pwsh
        run: Invoke-Pester -Path .\tests\powershell\LibreSpot.Tests.ps1 -CI -Output Detailed

      - name: Build desktop shell
        shell: powershell
        run: dotnet build .\src\LibreSpot.Desktop\LibreSpot.Desktop.csproj --no-restore

      - name: Run non-WPF .NET tests
        shell: powershell
        run: dotnet test .\tests\LibreSpot.Desktop.Tests\LibreSpot.Desktop.Tests.csproj --no-restore --filter "FullyQualifiedName!~Wpf"
